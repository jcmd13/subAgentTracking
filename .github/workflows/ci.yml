name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt
          ./venv/bin/pip install -e .

      - name: Run tests (correctness gate)
        run: ./venv/bin/pytest tests/ -v -m "not performance"

      # Benchmarks assert absolute throughput/latency, which is hardware-
      # dependent and flaky on shared runners. Run them for visibility but
      # never fail the build on them.
      - name: Run performance benchmarks (non-blocking)
        continue-on-error: true
        run: ./venv/bin/pytest tests/ -v -m performance
